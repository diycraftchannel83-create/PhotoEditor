name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinsPhotoStudio-unit-test-reports
          path: app/build/test-results/testDebugUnitTest/**/*.xml
          if-no-files-found: warn
      - name: Android lint
        run: gradle lintDebug
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Build release APK (unsigned)
        run: gradle assembleRelease
      - name: Build release Android App Bundle (unsigned)
        run: gradle bundleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WinsPhotoStudio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: WinsPhotoStudio-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: WinsPhotoStudio-release-aab-unsigned
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
