name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Print unit test failure details
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/testDebugUnitTest/**/*.xml', recursive=True)
          failed = 0
          for file in files:
              try:
                  root = ET.parse(file).getroot()
              except Exception as exc:
                  print(f'Cannot parse {file}: {exc}')
                  continue
              for case in root.iter('testcase'):
                  for node in list(case):
                      if node.tag in ('failure', 'error'):
                          failed += 1
                          print(f'\\nFAILED: {case.attrib.get("classname", "")}.{case.attrib.get("name", "")}')
                          print(f'  Type: {node.attrib.get("type", "")}')
                          print(f'  Message: {node.attrib.get("message", "")}')
                          print((node.text or '')[-5000:])
          print(f'\\nDetailed failing tests printed: {failed}')
          PY
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinsPhotoStudio-unit-test-reports
          path: app/build/test-results/testDebugUnitTest/**/*.xml
          if-no-files-found: warn
