name: Android Debug APK

on:
  push:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.xml'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/WinsPhotoStudio-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WinsPhotoStudio-debug-${{ github.run_number }}
          path: release-apk/WinsPhotoStudio-debug.apk
          if-no-files-found: error
          retention-days: 14
